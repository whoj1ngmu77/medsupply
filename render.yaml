services:
  - type: web
    name: medsupply-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: medsupply_incidents
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REPLENISH_SCAN_INTERVAL
        value: "120"
      - key: REPLENISH_GATEWAY_INTERVAL
        value: "30"
