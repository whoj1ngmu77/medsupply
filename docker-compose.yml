services:
  postgres:
    image: postgres:16
    container_name: medsupply_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: medsupply
      POSTGRES_PASSWORD: medsupply_dev_pw
      POSTGRES_DB: medsupply
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "deadlock_timeout=1s"
      - "-c"
      - "log_lock_waits=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsupply -d medsupply"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: medsupply_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: medsupply
      MONGO_INITDB_ROOT_PASSWORD: medsupply_dev_pw
      MONGO_INITDB_DATABASE: medsupply_incidents
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
